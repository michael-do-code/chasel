spring.application.name=chasel
spring.datasource.url=jdbc:h2:file:./data/chaseldb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Uses JWT_SECRET when deployed and a development-only fallback on this Mac.
jwt.secret=${JWT_SECRET:local-development-key-not-for-production-32bytes}

logging.level.org.springframework.security=DEBUG
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB
