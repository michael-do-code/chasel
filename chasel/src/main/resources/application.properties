spring.application.name=chasel
spring.datasource.url=jdbc:h2:file:./data/chaseldb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Uses JWT_SECRET when deployed and a development-only fallback on this Mac.
jwt.secret=${JWT_SECRET:local-development-key-not-for-production-32bytes}

logging.level.org.springframework.security=DEBUG
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB

# How long a newly placed order remains eligible for buyer cancellation.
orders.cancellation-window=30m
orders.processing-check-interval=15000

# Buyer confirmation email. Set MAIL_ENABLED=true and provide SMTP values to
# deliver real messages. The defaults keep local development safe/offline.
chasel.mail.enabled=${MAIL_ENABLED:false}
chasel.mail.from=${MAIL_FROM:no-reply@chasel.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
